name: Problem
description: "Select this if there is a problem you are aware of in your own project and can't work on it right now, or if you think you've found a problem or bug in someone elses service."
type: Problem
body:
- type: dropdown
  id: service
  attributes:
    label: Where is the problem?
    options:
    - Frontend
    - Generic Backend
    - User API
    - Game API
    - Steamboat
    - gRPC
    - dev
    - Infrastructure
    - "kinda everywhere :("
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Problem Description
    description: Describe the problem as clearly and specifically as possible.
  validations:
    required: true
